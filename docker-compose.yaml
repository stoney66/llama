services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - ./models:/models
    command:
      - "-m"
      - "/models/Qwen3.8-27B-YMQ-M.gguf"
      - "--alias"
      - "qwen3-8-27b"
      - "--ctx-size"
      - "131072"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--spec-type"
      - "draft-mtp"
      - "--spec-draft-n-max"
      - "3"
      - "--flash-attn"
      - "on"
      - "--chat-template-kwargs"
      - '{"enable_thinking":false}'
      - "--port"
      - "9931"
      - "--jinja"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9931/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
