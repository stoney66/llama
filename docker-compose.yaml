services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - ./models:/models
    command: >
      -m /models/gemma-4-E4B-it-Q8_0.gguf
      --alias gemma-4-e4b
      --ctx-size 16384
      --n-gpu-layers 999
      --port 9931
      --jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9931/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
