services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - ./models:/models
    command: >
      -m /models/gemma-4-E2B-it-Q8_0.gguf
      --ctx-size 16384
      --n-gpu-layers 999
      --host 0.0.0.0
      --port 9931
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
