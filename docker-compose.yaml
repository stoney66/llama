services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "9931:9931"
    volumes:
      - ./models:/models
    command: >
      -m /models/Qwen3.5-9B-Q8_0.gguf
      --alias qwen3-5-9b
      --ctx-size 32768
      --n-gpu-layers 999
      --port 9931
      --jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9931/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
